---
- name: "Bootstrap devices over console"
  # Note: Ansible requires a host/group here for inventory context,
  # even though the configuration is being sent over serial.
  # Either replace 'all' with the device(s) you're targeting, or use -l/--limit on the command line to target specific
  # device(s)
  hosts: all
  connection: local
  gather_facts: false
  vars:
    user: "root" # Most Juniper devices come with a factory default root user and no password
    password: ""
    serial_port: "/dev/cu.usbserial-ABSCE0OL" # My macOS serial device path, change if needed
  tasks:
    - name: "Ensure facts are gathered from device"
      juniper.device.facts:
        mode: "serial"
        port: "{{ serial_port }}"
        baud: 9600
        user: "{{ user }}"
        passwd: "{{ password }}"
      register: device_output

    - name: "Ensure device model is set as fact"
      ansible.builtin.set_fact:
        device_model: "{{ device_output.ansible_facts.junos.model | lower }}"

    - name: "Retrieve the current committed configuration"
      juniper.device.config:
        retrieve: "committed"
        filter: "system/root-authentication"
        mode: "serial"
        port: "{{ serial_port }}"
        baud: 9600
        user: "{{ user }}"
        passwd: "{{ password }}"
        diff: false
        check: false
        commit: false
      register: current_config

    - name: "Render juniper.conf.j2 locally to inherit Ansible variables"
      ansible.builtin.template:
        src: "juniper.conf.j2"
        dest: "/tmp/rendered_juniper_config_{{ inventory_hostname }}.conf"
        mode: '0600'
      changed_when: false

    - name: "Ensure bootstrap configuration is loaded to Juniper device over serial"
      juniper.device.config:
        load: "override"
        format: "text"
        src: "/tmp/rendered_juniper_config_{{ inventory_hostname }}.conf"
        comment: "Loaded bootstrap configuration with Ansible"
        mode: "serial"
        port: "{{ serial_port }}"
        baud: 9600
        user: "{{ user }}"
        passwd: "{{ password }}"
      when: "'root-authentication' not in current_config.config"

    - name: "Ensure locally rendered file is removed"
      ansible.builtin.file:
        path: "/tmp/rendered_juniper_config_{{ inventory_hostname }}.conf"
        state: absent
      changed_when: false
